[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restage-python"
version = "0.2.0"
description = "ReStage decorator runtime for Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ReStage Python"}]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
restage-py = "restage_py.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
